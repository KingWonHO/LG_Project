# ============================================================
# LG_Project 통합 배포 (docker compose)
#   ollama       : 로컬 LLM 데몬 (gemma3:4b)
#   ollama-init  : 최초 1회 모델 pull 후 종료
#   backend      : FastAPI (분석/판정/RAG/LLM 대화/리포트)
#   frontend     : React 빌드 → nginx (/api 를 backend로 프록시)
# 실행: docker compose up -d --build
#   - 프론트:  http://localhost:8080
#   - API:     http://localhost:8000/docs
# ============================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: lgproject-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # GPU 사용 시 주석 해제 (NVIDIA Container Toolkit 필요)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 최초 1회 gemma3:4b 다운로드 후 종료 (compose up 시 자동)
  ollama-init:
    image: ollama/ollama:latest
    container_name: lgproject-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull gemma3:4b"]
    restart: "no"

  backend:
    build: ./backend
    container_name: lgproject-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LOCAL_LLM_MODEL=gemma3:4b
    volumes:
      # 참조데이터(agentData/trip_case.json) + 산출물(app.db/chroma/uploads) 모두 호스트에 영속
      - ./backend/data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lgproject-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
